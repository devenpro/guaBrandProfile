name: Release

# Tag-on-version-change pattern:
#   When package.json#version changes on a push to main, this workflow
#   creates a matching v<VERSION> tag, attaches the committed dist/
#   bundles to a GitHub Release, and writes release notes from the
#   commits since the previous tag. If the version did not change, the
#   workflow exits silently — every other push to main is a no-op.
#
# This workflow does NOT rebuild dist/. Per CLAUDE.md, dist/ is
# committed in source; this workflow only publishes what is already
# committed. If you want CI to verify reproducibility, add a
# `npm ci && npm run build && git diff --exit-code dist/` step before
# the release job.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if version unchanged
        id: changed
        run: |
          if git rev-parse --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists — nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify dist/ is committed
        if: steps.changed.outputs.skip == 'false'
        run: |
          for f in dist/bpw.min.js dist/bpw.min.css dist/bpw.js dist/bpw.css; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing from the commit. Run 'npm run build' and commit dist/ before bumping version." >&2
              exit 1
            fi
          done

      - name: Generate release notes
        if: steps.changed.outputs.skip == 'false'
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "notes<<EOF_NOTES"
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since $PREV_TAG:"
              echo ""
              git log "$PREV_TAG"..HEAD --pretty=format:'- %s (%h)' --no-merges
            else
              echo "Initial release."
              echo ""
              git log --pretty=format:'- %s (%h)' --no-merges | head -50
            fi
            echo ""
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.changed.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.changed.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            dist/bpw.min.js
            dist/bpw.min.js.map
            dist/bpw.min.css
            dist/bpw.min.css.map
            dist/bpw.js
            dist/bpw.js.map
            dist/bpw.css
            dist/bpw.css.map
          fail_on_unmatched_files: true
